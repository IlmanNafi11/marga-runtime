name: Release

# One tag is one release: five platform binaries with checksums and a
# multi-arch image on GHCR and Docker Hub. The tag is the only version source;
# nothing here reads a version file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      spike:
        description: "Cross-toolchain spike: build darwin/amd64, darwin/arm64 and windows/amd64 without publishing"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: unit tests
    needs: [meta]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.work is gitignored; read the floor from a committed module.
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            framework/go.sum
            transports/go.sum
            cli/go.sum
            plugins/*/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up the Go workspace
        run: bash .github/workflows/scripts/setup-go-workspace.sh

      - name: Build UI
        run: make build-ui

      - name: Core unit tests
        run: bash .github/workflows/scripts/run-core-unit-tests.sh core

      - name: Framework, transport and plugin unit tests
        run: |
          # Same light tier as ci.yml: -short skips the service-backed tests, so
          # a tag is not gated on containers it does not start.
          modules=(framework transports)
          for dir in plugins/*/; do
            [ -f "$dir/go.mod" ] && modules+=("${dir%/}")
          done
          for module in "${modules[@]}"; do
            ( cd "$module" && env -u CI go test -short -timeout 20m ./... )
          done

  binaries:
    name: binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [meta, verify]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: darwin, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.work is gitignored; read the floor from a committed module.
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            framework/go.sum
            transports/go.sum
            cli/go.sum
            plugins/*/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up the Go workspace
        run: bash .github/workflows/scripts/setup-go-workspace.sh

      - name: Install cross compilers
        # Every leg needs one: darwin o64/oa64-clang, windows mingw, and linux the
        # real musl-tools gcc that build-release-binary.sh exports as CC. Skipping
        # linux here broke both linux legs with
        # `cgo: C compiler "x86_64-linux-musl-gcc" not found`.
        run: bash .github/workflows/scripts/install-cross-compilers.sh "${{ matrix.goos }}"

      - name: Build UI
        run: make build-ui

      - name: Build binary
        run: |
          bash .github/workflows/scripts/build-release-binary.sh \
            "${{ matrix.goos }}" "${{ matrix.goarch }}" \
            "${{ needs.meta.outputs.version }}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: GitHub release
    needs: [meta, verify, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: marga-runtime ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*

  image:
    name: image linux/${{ matrix.arch }}
    needs: [meta, verify]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::vars.DOCKERHUB_USERNAME is not set for this repository"
            exit 1
          fi
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(bash .github/workflows/scripts/compute-image-tags.sh "$VERSION" "$ARCH" "ghcr.io/${GITHUB_REPOSITORY,,}")
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(bash .github/workflows/scripts/compute-image-tags.sh "$VERSION" "$ARCH" "${DOCKERHUB_USERNAME}/marga-runtime")
          docker build --build-arg "VERSION=$VERSION" "${tags[@]}" --pull .
          docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push --all-tags "${DOCKERHUB_USERNAME}/marga-runtime"

  image-manifest:
    name: image manifest
    needs: [meta, verify, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::vars.DOCKERHUB_USERNAME is not set for this repository"
            exit 1
          fi
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Combine architecture images
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          repositories=(
            "ghcr.io/${GITHUB_REPOSITORY,,}"
            "${DOCKERHUB_USERNAME}/marga-runtime"
          )
          for repo in "${repositories[@]}"; do
            sources=(
              --amend "${repo}:v${VERSION}-amd64"
              --amend "${repo}:v${VERSION}-arm64"
            )
            if [ "$PRERELEASE" = "true" ]; then
              docker buildx imagetools create "${sources[@]}" \
                --tag "${repo}:v${VERSION}" --tag "${repo}:${VERSION}"
            else
              docker buildx imagetools create "${sources[@]}" \
                --tag "${repo}:v${VERSION}" --tag "${repo}:${VERSION}" --tag "${repo}:latest"
            fi
          done

  # Manual proof that the darwin/windows toolchains on a GitHub runner can
  # compile the release contract before the next real tag relies on them.
  # Runs only on dispatch; every publishing job above is push-gated.
  spike-cross:
    name: spike ${{ matrix.goos }}/${{ matrix.goarch }}
    if: github.event_name == 'workflow_dispatch' && inputs.spike
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.work is gitignored; read the floor from a committed module.
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            framework/go.sum
            transports/go.sum
            cli/go.sum
            plugins/*/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install cross compilers
        run: bash .github/workflows/scripts/install-cross-compilers.sh

      - name: Set up the Go workspace
        run: bash .github/workflows/scripts/setup-go-workspace.sh

      - name: Build UI
        run: make build-ui

      - name: Build binary
        run: |
          bash .github/workflows/scripts/build-release-binary.sh \
            "${{ matrix.goos }}" "${{ matrix.goarch }}" 0.0.0-spike dist-spike

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist-spike/*
          if-no-files-found: error
