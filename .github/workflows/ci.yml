name: CI

# Everything a pull request needs and nothing it does not: no service
# containers, no secrets, no registry. Service-backed suites live in
# full-tests.yml and are dispatched on demand.
on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build, vet, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.work is gitignored, so it does not exist before checkout has run
          # the workspace step below; read the floor from a committed module.
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            framework/go.sum
            transports/go.sum
            cli/go.sum
            plugins/*/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up the Go workspace
        run: bash .github/workflows/scripts/setup-go-workspace.sh

      - name: Build UI
        run: make build-ui

      - name: Build binary
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-http-linux-amd64
          path: tmp/bifrost-http
          if-no-files-found: error

      - name: Vet
        run: |
          modules=(core framework transports)
          for dir in plugins/*/; do
            [ -f "$dir/go.mod" ] && modules+=("${dir%/}")
          done
          for module in "${modules[@]}"; do
            echo "::group::go vet $module"
            ( cd "$module" && go vet ./... )
            echo "::endgroup::"
          done

      - name: Core unit tests
        run: bash .github/workflows/scripts/run-core-unit-tests.sh core

      - name: Framework, transport and plugin unit tests
        run: |
          # CI is unset and -short is on: the service-backed tests then skip
          # themselves instead of failing on a refused port, which is the whole
          # point of this tier. They are covered by full-tests.yml, which sets
          # CI=1 and runs without -short against real containers.
          modules=(framework transports)
          for dir in plugins/*/; do
            [ -f "$dir/go.mod" ] && modules+=("${dir%/}")
          done
          for module in "${modules[@]}"; do
            echo "::group::go test $module"
            ( cd "$module" && env -u CI go test -short -timeout 20m ./... )
            echo "::endgroup::"
          done

      - name: UI i18n check
        working-directory: ui
        run: npm run i18n:check
