version: 2
updates:
  # Go workspace modules. The root has no go.mod, so every module is listed.
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /framework
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /transports
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /plugins/*
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
